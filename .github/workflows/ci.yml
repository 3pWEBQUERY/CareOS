# CI (PRD §37, §66): Typecheck, Unit-Tests, Integrationstests gegen Postgres (tests/integration, Rate-Limit), Migrationen, Build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careos
          POSTGRES_PASSWORD: careos
          POSTGRES_DB: careos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://careos:careos@localhost:5432/careos?schema=public
      TZ: Europe/Zurich
      APP_URL: http://localhost:3000
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      JOBS_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Migrationen anwenden
        run: npx prisma migrate deploy

      - name: Schema und Migrationen stimmen überein
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Unit- und Integrationstests (Postgres)
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: npm audit (Produktionsabhängigkeiten)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Meldet bekannte Schwachstellen, ohne den Merge zu blockieren; Updates kommen über Dependabot.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
