name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatierung
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typen
        # Route types (LayoutProps, PageProps) are generated by Next, not checked in.
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Handy-Schriftgrössen aktuell
        run: |
          npm run styles:mobile-type
          git diff --exit-code app/styles/39-mobile-type.css
      - name: Textkatalog der Übersetzungen aktuell
        run: |
          npm run i18n:extract
          git diff --exit-code locales/catalog.json
      - name: Build
        run: npx next build

  database:
    name: Datenbank-Tests (Postgres)
    runs-on: ubuntu-latest
    # Die Tests laufen nacheinander auf derselben Datenbank; die Sammlung braucht inzwischen rund 15 Minuten.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carecore_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrationen auf frischer Datenbank
        run: npm run test:db:setup
      - name: Seed zweimal (idempotent)
        run: |
          npm run test:db:seed
          npm run test:db:seed
      - name: Integrationstests
        run: npm run test:db

  e2e:
    name: Klicktests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carecore_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carecore_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Datenbank mit Demodaten
        run: npm run test:e2e:setup
      - name: Build
        run: npx next build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Klicktests
        run: npm run test:e2e
      - name: Spuren fehlgeschlagener Tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
